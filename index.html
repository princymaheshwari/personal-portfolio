  <meta charset="UTF-8" />

  <title>Case Nº 2026-PM — Princy Maheshwari</title>

    content="Case file on Princy Maheshwari: a Computer Science student who enters unfamiliar technical domains — heliophysics to bioinformatics — and ships working systems within hours. Explore the 3D evidence board." />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="assets/favicon.png" type="image/png" />
</head>

<body>
  <!-- loading -->
  <div id="loading" aria-hidden="true">
    <div class="loading-folder">OPENING CASE FILE…</div>
  </div>

  <!-- 3D board -->
  <canvas id="board-canvas" aria-label="3D evidence board — use the text view link for an accessible version"></canvas>
  <div id="board-tooltip" aria-hidden="true"></div>
  <div id="scroll-space"></div>

  <!-- case tabs -->
  <nav class="casebar" aria-label="Case sections">
    <a class="case-title" href="#" data-region="subject"><b>CASE Nº 2026-PM</b> · THE FAST LEARNER</a>
    <div class="case-tabs">
      <a href="#" data-region="subject">SUBJECT</a>
      <a href="#" data-region="trail">THE TRAIL</a>
      <a href="#" data-region="evidence">EVIDENCE</a>
      <a href="#" data-region="mo">M.O.</a>
      <a href="#" data-region="tipline">TIP LINE</a>
      <a href="#" class="mode-switch" title="Accessible text version">TEXT VIEW</a>
    </div>
  </nav>

  <!-- dossier detail panel -->
  <aside id="dossier" role="dialog" aria-modal="true" aria-labelledby="dossier-heading" aria-hidden="true">
    <div class="dossier-paper">
      <button id="dossier-close" aria-label="Close file">CLOSE FILE ✕</button>
      <div id="dossier-body"></div>
    </div>
  </aside>

  <!-- semantic text fallback (reduced motion / no WebGL / manual switch) -->
  <main id="flat-root"></main>

  <!-- tip line -->
  <section id="tipline" aria-label="Contact" aria-hidden="true">
    <div class="tip-paper">
      <button id="tipline-close" aria-label="Close tip line">CLOSE TIP LINE ✕</button>
      <p class="tip-head" id="tipline-heading">☎ TIP LINE</p>
      <p class="tip-sub">Wanna build something technically ambitious? Then contact me. Leave a statement — replies within 48 hours. Atlanta, GA.</p>
      <form id="contactForm" novalidate>
        <div class="form-row">
          <div class="field">
            <label for="firstName">First name *</label>
            <input type="text" id="firstName" name="firstName" required autocomplete="given-name" placeholder="Jane" />
          </div>
          <div class="field">
            <label for="lastName">Last name *</label>
            <input type="text" id="lastName" name="lastName" required autocomplete="family-name" placeholder="Doe" />
          </div>
        </div>
        <div class="field">
          <label for="email">Email *</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com" />
        </div>
        <div class="field">
          <label for="subject">Nature of tip *</label>
          <select id="subject" name="subject" required>
            <option value="">Select…</option>
            <option value="job-opportunity">Job opportunity</option>
            <option value="project-inquiry">Project inquiry</option>
            <option value="collaboration">Research collaboration</option>
            <option value="general">General sighting</option>
          </select>
        </div>
        <div class="field">
          <label for="message">Statement *</label>
          <textarea id="message" name="message" rows="4" required
            placeholder="Describe what you saw, or what you'd like to build…"></textarea>
        </div>
        <input type="hidden" name="_subject" value="New message from Princy Maheshwari Portfolio!" />
        <input type="hidden" name="site" value="Princy Maheshwari Portfolio" />
        <button type="submit" class="stamp-btn" id="submitBtn">
          <span id="submitText">FILE THE TIP</span>
          <span id="submitLoading" class="hidden">TRANSMITTING…</span>
        </button>
        <p id="formMessage" class="form-message hidden" role="status"></p>
      </form>
    </div>
  </section>

  <footer class="flat-footer">
    <p>© 2026 PRINCY MAHESHWARI · <a href="https://github.com/princymaheshwari" target="_blank" rel="noopener">GITHUB</a> ·
      <a href="https://www.linkedin.com/in/princy-maheshwari1/" target="_blank" rel="noopener">LINKEDIN</a></p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="data.js"></script>
  <script src="board.js"></script>
  <script src="main.js"></script>
</body>

</html>
